[package]
name = "fieldnotes-field-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Also supplies the A1 shared property registry (`fieldnotes_domain::property::
# registry`), which this crate needs to reject an unprefixed name A1 does not
# define. The registry is shared vocabulary with no byte form of its own, so
# depending on it here does not pull in the canonical serializer; see ADR 0010.
fieldnotes-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
# Core computes its own digest over staged artifact bytes rather than trusting a
# Field's declared one, and does it streaming so a 512 MiB ceiling does not
# become a 512 MiB allocation.
sha2.workspace = true

[lints]
workspace = true
