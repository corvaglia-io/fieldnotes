[package]
name = "fieldnotes-field-fixture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
fieldnotes-field-protocol.workspace = true
# The reusable Field-authoring SDK: the shared frame emitter, argv-parsing
# and request-reading boilerplate. Reused here -- not just by a well-behaved
# Field -- deliberately: if a helper does not also fit this Field's need to
# misbehave on purpose, it does not belong in the SDK; see ADR 0009.
fieldnotes-field-sdk.workspace = true
serde_json.workspace = true

[dev-dependencies]
fieldnotes-domain.workspace = true
fieldnotes-format.workspace = true
fieldnotes-test-support.workspace = true
serde.workspace = true
# Release gate R1 requires driving *core's* `sync` against a **real child
# process** at every crash and malformed-output boundary, and
# `CARGO_BIN_EXE_<name>` resolves only inside the package that owns the binary —
# so that evidence lives in this package's tests. Dev-dependencies only: the
# fixture Field itself depends on the protocol library and never on the notebook
# store, exactly as A0's dependency rule requires.
fieldnotes-app.workspace = true
fieldnotes-store.workspace = true

[lints]
workspace = true
