[workspace]
resolver = "2"
members = [
    "crates/fieldnotes-app",
    "crates/fieldnotes-cli",
    "crates/fieldnotes-credentials",
    "crates/fieldnotes-domain",
    "crates/fieldnotes-field-protocol",
    "crates/fieldnotes-field-sdk",
    "crates/fieldnotes-format",
    "crates/fieldnotes-graph",
    "crates/fieldnotes-msgraph",
    "crates/fieldnotes-store",
    "crates/fieldnotes-test-support",
    "fields/fieldnotes-field-fixture",
    "fields/fieldnotes-field-jira",
    "fields/fieldnotes-field-local",
    "fields/fieldnotes-field-outlook-calendar",
    "fields/fieldnotes-field-outlook-contacts",
    "fields/fieldnotes-field-outlook-mail",
    "fields/fieldnotes-field-teams",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
fieldnotes-app = { path = "crates/fieldnotes-app" }
fieldnotes-credentials = { path = "crates/fieldnotes-credentials" }
fieldnotes-domain = { path = "crates/fieldnotes-domain" }
fieldnotes-field-protocol = { path = "crates/fieldnotes-field-protocol" }
fieldnotes-field-sdk = { path = "crates/fieldnotes-field-sdk" }
fieldnotes-format = { path = "crates/fieldnotes-format" }
fieldnotes-graph = { path = "crates/fieldnotes-graph" }
fieldnotes-msgraph = { path = "crates/fieldnotes-msgraph" }
fieldnotes-store = { path = "crates/fieldnotes-store" }
fieldnotes-test-support = { path = "crates/fieldnotes-test-support" }
# SHA-256 for the A1 hash domains (artifact bytes, fn-content-v1, fn-record-v1).
sha2 = "0.10.9"
# Command-line parsing for the `fieldnotes` binary, derive-based so the surface
# in `docs/cli.md` stays declarative. CLI crate only.
clap = { version = "4.5", features = ["derive"] }
# Cryptographically secure randomness for UUIDv7 generation, which A1 requires.
# Supplied by the composition root only; library crates take an injected
# `RandomSource`. CLI crate only.
getrandom = "0.3"
# IANA time-zone-database lookups for the persistent timezone setting (A1
# section 3 requires the source/client-local offset "at that instant", which a
# frozen numeric offset cannot give across a daylight-saving transition).
# `jiff` was chosen over `time`'s `local-offset` feature because it resolves a
# *named* zone (not just "the current system offset") for an arbitrary past or
# future instant, on macOS, Linux, and Windows, with only itself and its own
# tzdb helper crates in the dependency tree. CLI crate only; no other crate may
# depend on it, per the rule that only the composition root touches real
# timezone/environment data.
jiff = "0.2"
# Derive-based (de)serialization for the proposed A2 Field process protocol,
# whose wire format is newline-delimited JSON. Field-protocol crate and the
# fixture Field only; the notebook byte form stays hand-written in
# `fieldnotes-format` because A1 defines those bytes itself.
serde = { version = "1.0", features = ["derive"] }
# JSON reader/writer for the same NDJSON frames. Default features only: the
# `preserve_order` feature is deliberately not enabled so object keys stay in
# `BTreeMap` order and frame handling is deterministic.
serde_json = "1.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

